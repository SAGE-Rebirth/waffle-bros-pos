name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Format
        run: uv run ruff format --check

      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest

  frontend:
    name: Frontend tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm test

      - run: npm run build

  docker:
    name: Docker images build (api + web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: waffle-bros-pos-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          target: runtime
          push: false
          load: true
          tags: waffle-bros-pos-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Dev override is valid
        run: docker compose -p waffle-bros-dev -f compose.yaml -f compose.dev.yaml config --quiet
      - name: Smoke test through web
        run: |
          docker compose up -d --no-build --wait
          curl -fsS http://localhost:4000/api/health
          curl -fsS http://localhost:4000/api/menu | grep -q Nutella
          curl -fsS http://localhost:4000/ | grep -q '<div id="root">'
          curl -fsS http://localhost:4000/docs | grep -qi swagger
          curl -fsSI http://localhost:4000/ | grep -qi "content-security-policy"
          # the API's Host check still sees the real Host behind nginx
          ! curl -fsS --max-time 3 http://localhost:4000/api/health -H "Host: evil.example.com"
      - name: Logs
        if: always()
        run: docker compose logs
