# make dev: both services with live reload. Screens on http://localhost:5173 (this computer only), Swagger on
# http://localhost:8000/docs. Runs as a separate project (waffle-bros-dev) with its own
# pos-dev-data volume, so it never touches the shop's real data and can run next to `make up`.
services:
  api:
    image: waffle-bros-pos-api:dev
    command: ["uvicorn", "--factory", "waffle_pos.app:create_app", "--reload",
              "--reload-dir", "/app/src", "--host", "0.0.0.0", "--port", "4000"]
    environment:
      PYTHONPATH: /app/src   # the mounted source wins over the copy installed in the image
      WATCHFILES_FORCE_POLLING: "true"
      WB_FORWARDED_ALLOW_IPS: "*"
    volumes: !override
      - pos-dev-data:/data
      - ./src:/app/src:ro
    ports:
      # This computer only: the dev API trusts X-Forwarded-For from anyone (for the Vite proxy),
      # so on the Wi-Fi it would let a device dodge the per-tablet PIN lockout.
      - "127.0.0.1:8000:4000"

  web:
    image: waffle-bros-pos-web:dev   # never overwrites the shop's :latest image
    build:
      context: ./frontend
      target: dev
    environment:
      WB_API_URL: http://api:4000
      WB_POLL: "1"
    volumes:
      - ./frontend/src:/frontend/src:ro
      - ./frontend/public:/frontend/public:ro
      - ./frontend/index.html:/frontend/index.html:ro
    ports: !override
      - "127.0.0.1:5173:5173"  # this computer only: the dev server serves the source code
    read_only: false         # Vite writes its cache into node_modules/.vite
    healthcheck:
      disable: true

volumes:
  pos-dev-data:
