# docker compose up -d --build   ->  http://localhost:4000
services:
  pos:
    build: .
    image: waffle-bros-pos:latest
    container_name: waffle-bros-pos
    restart: unless-stopped
    ports:
      - "4000:4000"          # reachable from tablets on the shop Wi-Fi too. Never port-forward this
                             # on the router. To keep it on this PC only: "127.0.0.1:4000:4000"
    environment:
      WB_TIMEZONE: Asia/Kolkata
    volumes:
      - pos-data:/data       # sales, menu, expenses (SQLite). Survives rebuilds and updates.
    # Hardening: read-only image, no extra Linux capabilities, no privilege escalation.
    read_only: true
    tmpfs:
      - /tmp                 # backups are written here briefly before download
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  pos-data:
