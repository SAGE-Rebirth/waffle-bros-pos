[project]
name = "waffle-pos"
version = "0.2.0"
description = "Locally hosted point-of-sale and revenue-target dashboard for Waffle Bros, Bhopal"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.163.2",
    "google-auth>=2.62.2",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.0",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
waffle-pos = "waffle_pos.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/waffle_pos"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "PTH", "DTZ", "S", "ASYNC", "PL"]
ignore = [
  "DTZ001", "DTZ005", "DTZ007",  # times are shop-local and stored naive on purpose (see waffle_pos.clock)
  "PLR0913", "PLR2004",          # small helper signatures / literal thresholds in insights read better inline
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR0915"]
"src/waffle_pos/migrations/**" = ["N999", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
exclude = ["src/waffle_pos/migrations/versions/"]

[[tool.mypy.overrides]]
module = ["google.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=waffle_pos --cov-report=term-missing:skip-covered"

[tool.coverage.run]
omit = ["src/waffle_pos/migrations/*", "src/waffle_pos/__main__.py", "src/waffle_pos/demo.py"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]
