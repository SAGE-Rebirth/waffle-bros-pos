# nginx for the `web` service: serves the built screens and forwards the API to the `api` service.
# The API sets its own security headers; the ones below cover the screens' own files.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Look the api container up through Docker's DNS on each request (cached 10 s), so a rebuilt
    # api container with a new address is found without restarting this one.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:4000;

    # The API refuses bigger bodies itself (WB_MAX_BODY_BYTES); this only stops nginx cutting
    # them off first with a less helpful error.
    client_max_body_size 2m;

    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        # Keep the address the tablet typed: the API's DNS-rebinding check looks at it.
        proxy_set_header Host $http_host;
        # Overwrite (never append) so a client can't fake its address to dodge the PIN lockout.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;  # backups and Google Sheet syncs can take a while
    }

    # Swagger UI and the OpenAPI document.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built files have a content hash in their names, so they can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri =404;
    }

    # Everything else is the single-page app (Billing, Dashboard, Day End, #admin).
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri $uri/ /index.html;
    }
}
